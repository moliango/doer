name: Build Unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - 'TestFlight/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('.package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Generate Xcode project
        run: mise x -- tuist install && mise x -- tuist generate --no-open

      - name: Set build number
        id: buildnumber
        run: echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build unsigned IPA
        env:
          CURRENT_PROJECT_VERSION: ${{ steps.buildnumber.outputs.build }}
        run: ./ci_scripts/build_unsigned_ipa.sh
      - name: Read version
        id: version
        run: |
          VERSION=$(grep -o '"MARKETING_VERSION": "[^"]*"' Project.swift | grep -o '"[^"]*"$' | tr -d '"')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Create tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "refs/tags/${TAG}$"; then
            gh release delete "$TAG" --yes || true
            git push origin ":refs/tags/${TAG}" || true
          fi
          git tag -f "$TAG"
          git push origin "$TAG" --force
          gh release create "$TAG" build/doer-unsigned.ipa \
            --title "Doer $TAG" \
            --generate-notes
